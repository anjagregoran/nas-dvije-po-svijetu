<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Putokaz</title>
  <meta name="theme-color" content="#fbf4ea">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <a class="back" href="index.html">← Putokaz</a>
      <a class="title" id="naslov" href="#/"></a>
    </div>
  </header>

  <main class="wrap narrow guide" id="app"></main>

  <div class="tabs">
    <nav>
      <a href="#/mjesta" data-tab="mjesta">Mjesta</a>
      <a href="#/hrana" data-tab="hrana">Hrana</a>
      <a href="#/kultura" data-tab="kultura">Kultura</a>
      <a href="#/ako-zelis" data-tab="ako-zelis">Ako želiš</a>
      <a href="#/jos" data-tab="jos">Još</a>
    </nav>
  </div>

  <script src="data/koordinate.js"></script>
  <script src="js/karta.js"></script>
  <script>
    // Učitaj osnovnu datoteku vodiča, zatim njezine dodatke redom, pa tek onda aplikaciju.
    (function () {
      var id = (new URLSearchParams(location.search).get('p') || 'apulija').replace(/[^a-z0-9-]/g, '');
      function load(src, ok, fail) {
        var s = document.createElement('script');
        s.src = src; s.onload = ok; s.onerror = fail || ok;
        document.body.appendChild(s);
      }
      load('data/' + id + '.js', function () {
        var rest = (window.TRIP.dodaci || []).slice();
        (function next() {
          if (!rest.length) return load('js/trip.js', function () {});
          load('data/' + rest.shift() + '.js', next);
        })();
      }, function () {
        document.getElementById('app').innerHTML = '<p style="padding-top:40px">Ovaj vodič još nije napisan. <a href="index.html">Natrag na početnu</a></p>';
      });
    })();
  </script>
</body>
</html>
