    <div class="wrap">
      <a class="logo" href="index.html">Taste the Map</a>

        <a href="index.html#zemlje" class="here">Explore</a>

  <script src="data/koordinate.js?v=11"></script>

  <script>
    // Učitaj osnovnu datoteku vodiča, zatim njezine dodatke redom, pa tek onda aplikaciju.
    (function () {
      var id = (new URLSearchParams(location.search).get('p') || 'apulija').replace(/[^a-z0-9-]/g, '');
      function load(src, ok, fail) {
        var s = document.createElement('script');
        s.src = src; s.onload = ok; s.onerror = fail || ok;
        document.body.appendChild(s);
      }
      load(window.BASE + id + '.js', function () {
        var rest = (window.TRIP.dodaci || []).slice();
        (function next() {
          if (!rest.length) return load('js/trip.js', function () {});
          load(window.BASE + rest.shift() + '.js', next);
        })();
      }, function () {
        document.getElementById('app').innerHTML = '<p style="padding-top:40px">This guide is not written yet. <a href="index.html">Back to home</a></p>';
      });
    })();
  </script>
</body>
