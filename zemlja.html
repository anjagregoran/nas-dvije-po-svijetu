<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Taste the Map</title>
  <meta name="theme-color" content="#fbf4ea">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script src="js/i18n.js?v=15"></script>
  <link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <a class="logo" href="index.html">Taste the Map</a>
      <nav>
        <a href="index.html#zemlje" class="here">Explore</a>
        <a href="putovanja.html">Our trips</a>
      </nav>
      <span id="naslov" hidden></span>
    </div>
  </header>

  <main class="wrap" id="app" style="min-height:80vh"></main>

  <footer class="foot">
    <a class="logo" href="index.html">Taste the Map</a>
    Prices and opening hours change, so check official sites before you go.
  </footer>

  <script src="data/koordinate.js?v=15"></script>
  <script src="js/karta.js?v=15"></script>
  <script src="js/restorani.js?v=15"></script>
  <script>
    (function () {
      var id = (new URLSearchParams(location.search).get('z') || '').replace(/[^a-z0-9-]/g, '');
      window.ZEMLJA_ID = id;
      var dirs = [window.BASE + 'europa/', window.BASE + 'svijet/'];
      (function tryNext() {
        if (!dirs.length) {
          document.getElementById('app').innerHTML = '<p style="padding-top:40px">This country is not written yet. <a href="index.html">Back to home</a></p>';
          return;
        }
        var s = document.createElement('script');
        s.src = dirs.shift() + id + '.js';
        s.onload = function () {
          // Dodaci (skriveni dragulji, što kupiti, kao domaći) nisu obvezni: stranica radi i bez njih.
          function app() {
            var a = document.createElement('script');
            a.src = 'js/zemlja.js?v=15';
            document.body.appendChild(a);
          }
          // Try the add-ons in the chosen language first, then fall back to English.
          var places = [window.BASE + 'dodaci/', 'data/dodaci/'];
          (function tryAddons() {
            if (!places.length) return app();
            var d = document.createElement('script');
            d.src = places.shift() + id + '.js?v=15';
            d.onload = app; d.onerror = tryAddons;
            document.body.appendChild(d);
          })();
        };
        s.onerror = tryNext;
        document.body.appendChild(s);
      })();
    })();
  </script>
</body>
</html>
